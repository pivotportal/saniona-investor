<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    /* ---- neumorphism base tokens (light) — from tokens.md formulas ---- */
    --nm-bg: #ECF0F3;
    --nm-shadow-dark: #D1D9E6;
    --nm-shadow-light: #FFFFFF;
    --nm-text: #2E3A46;          /* 10.13:1 — AAA */
    --nm-text-muted: #5D677A;    /* 4.97:1 — AA (verified) */
    /* accent = Sanionas varumärkesblå, validerad */
    --nm-accent-1: #3E5C8C;      /* 5.88:1 graphic — decorative/gradient light end */
    --nm-accent-2: #32496F;      /* 7.90:1 text — contrast-safe workhorse */
    --nm-accent-gradient: linear-gradient(135deg, var(--nm-accent-1), var(--nm-accent-2));

    /* soft preset — dense financial data (intensity table) */
    --nm-distance: 6px;
    --nm-blur: 12px;
    --nm-radius: 20px;

    /* semantic layer */
    --color-surface: var(--nm-bg);
    --color-text: var(--nm-text);
    --color-text-muted: var(--nm-text-muted);
    --color-primary-strong: var(--nm-accent-2);

    /* scale.md — spacing (4/8 grid) */
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
    --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
    /* scale.md — type (modular 1.25) */
    --fs-xs:.64rem; --fs-sm:.8rem; --fs-base:1rem; --fs-md:1.25rem;
    --fs-lg:1.563rem; --fs-xl:1.953rem; --fs-2xl:2.441rem;
    --lh-tight:1.15; --lh-snug:1.35; --lh-normal:1.5; --lh-relaxed:1.6;
  }
  [data-theme="dark"] {
    --nm-bg: #24262B;
    --nm-shadow-dark: #1C1E22;
    --nm-shadow-light: #2F323A;
    --nm-text: #E4E7EC;
    --nm-text-muted: #8B909C;
    --nm-accent-1: #6E8FC0;      /* lightened for dark surface legibility */
    --nm-accent-2: #92AEDA;
  }

  body{
    margin:0; background:var(--color-surface); color:var(--color-text);
    font-family:'Inter',system-ui,sans-serif; line-height:var(--lh-normal);
    padding:var(--space-7) 0;
    padding-top:calc(var(--space-7) + env(safe-area-inset-top,0px));
    transition:background .3s ease, color .3s ease;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 var(--space-5)}

  /* theme toggle (a real interactive component → full states) */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-5)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:var(--space-7);margin-bottom:var(--space-4);gap:var(--space-3);flex-wrap:wrap}
  .toolbar-right{display:flex;align-items:center;gap:var(--space-3)}

  /* icon-only theme button — round, raised, symbol only */
  .theme-ico{
    width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;
    font-size:var(--fs-md);line-height:1;color:var(--nm-accent-2);
    background:var(--nm-bg);border:none;cursor:pointer;border-radius:9999px;
    box-shadow:var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light);
    transition:transform .12s ease, filter .12s ease, box-shadow .08s ease;
  }
  .theme-ico:hover{transform:translateY(-1px);filter:brightness(1.02)}
  .theme-ico:focus-visible{outline:2px solid var(--nm-accent-2);outline-offset:3px}
  .theme-ico:active{transform:none;
    box-shadow:inset var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               inset calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light)}
  @media(prefers-reduced-motion:reduce){ .theme-ico:hover{transform:none} }

  /* ---- brand mesh logo header ---- */
  .brand{margin-bottom:var(--space-6)}
  .brand-mesh{position:relative;width:100%;max-width:520px;height:56px;margin-left:-6px;user-select:none}
  .brand-mesh canvas{display:block;width:100%;height:100%}
  .brand-mesh .brand-fallback{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;letter-spacing:-.02em;color:var(--nm-accent-2);line-height:1.1;position:absolute;inset:0;display:flex;align-items:center;white-space:nowrap;padding-left:6px}
  .brand-mesh.gl-on .brand-fallback{opacity:0;pointer-events:none}
  .brand-sub{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-sm);color:var(--color-text-muted);margin-top:var(--space-2);letter-spacing:.03em}
  .brand-sub .ticker{color:var(--nm-accent-2);text-decoration:none;font-weight:600}
  .brand-sub .ticker:hover{text-decoration:underline}
  .brand-sub .ticker:focus-visible{outline:2px solid var(--nm-accent-2);outline-offset:2px}
  .brand-updated{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted);margin-top:var(--space-1)}
  @media(max-width:520px){ .brand-mesh{height:44px} .brand-mesh .brand-fallback{font-size:30px} }

  /* ---- language toggle: neumorphic segmented control ---- */
  .lang-seg{display:inline-flex;padding:3px;border-radius:9999px;background:var(--nm-bg);
    box-shadow:inset 3px 3px 6px var(--nm-shadow-dark), inset -3px -3px 6px var(--nm-shadow-light)}
  .lang-seg button{
    font-family:'IBM Plex Mono',monospace;font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;
    border:none;background:transparent;color:var(--color-text-muted);cursor:pointer;
    padding:var(--space-1) var(--space-3);border-radius:9999px;transition:color .15s ease;
  }
  .lang-seg button.on{
    color:#fff;background:var(--nm-accent-2);
    box-shadow:2px 2px 5px var(--nm-shadow-dark), -2px -2px 5px var(--nm-shadow-light);
  }
  .lang-seg button:focus-visible{outline:2px solid var(--nm-accent-2);outline-offset:2px}

  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-sm);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--color-text-muted)}
  .nm-btn{
    font-family:'IBM Plex Mono',monospace;font-size:var(--fs-sm);font-weight:600;letter-spacing:.05em;
    color:var(--color-text);background:var(--nm-bg);border:none;cursor:pointer;
    padding:var(--space-2) var(--space-4);border-radius:9999px;
    box-shadow:var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light);
    transition:transform .12s ease, filter .12s ease, box-shadow .08s ease;
  }
  .nm-btn:hover{transform:translateY(-1px);filter:brightness(1.02)}
  .nm-btn:focus-visible{outline:2px solid var(--nm-accent-2);outline-offset:3px}
  .nm-btn:active{
    transform:none;
    box-shadow:inset var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               inset calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light);
  }
  @media(prefers-reduced-motion:reduce){ .nm-btn:hover{transform:none} }

  /* ---- KPI grid ---- */
  .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-3)}
  @media(max-width:900px){ .kpi-grid{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:520px){ .kpi-grid{grid-template-columns:1fr;gap:var(--space-2)} }

  /* stat card = raised element (components.md .nm-raised + scale.md stat-card recipe) */
  .kpi{
    background:var(--nm-bg);border-radius:16px;
    padding:var(--space-4);
    display:flex;flex-direction:column;gap:var(--space-1);
    box-shadow:var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light);
    transition:transform .12s ease, filter .12s ease;
  }
  .kpi:hover{transform:translateY(-1px);filter:brightness(1.01)}
  @media(prefers-reduced-motion:reduce){ .kpi:hover{transform:none} }

  /* headline number — md figure (compacted from 2xl) */
  .kpi .v{
    font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:var(--fs-lg);line-height:var(--lh-tight);letter-spacing:-.02em;
    color:var(--nm-accent-2);   /* single most important callout → accent-2 (contrast-safe 7.9:1) */
  }
  .kpi .u{
    font-size:var(--fs-xs);line-height:var(--lh-relaxed);font-weight:600;
    color:var(--color-text);
  }
  .kpi .note{
    font-size:var(--fs-xs);line-height:var(--lh-relaxed);
    color:var(--color-text-muted);
    margin-top:var(--space-1);padding:var(--space-2);
    border-radius:10px;
    box-shadow:inset 2px 2px 5px var(--nm-shadow-dark),
               inset -2px -2px 5px var(--nm-shadow-light);
  }

  /* ---- thesis ---- */
  .thesis{margin-top:var(--space-6);padding:var(--space-5);border-radius:var(--nm-radius);
    background:var(--nm-bg);
    box-shadow:var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light)}
  .thesis .t-lbl{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-xs);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:var(--space-2)}
  .thesis-body p{margin:0;font-size:var(--fs-base);line-height:var(--lh-relaxed);color:var(--color-text)}
  .thesis-body p+p{margin-top:var(--space-3)}

  /* ---- scroll-spy nav (sticky) ---- */
  /* full-bleed sticky nav that softly melts into the content below (no hard edge).
     It sits inside .wrap but breaks out to the full viewport width. */
  /* full-width sticky nav. Break out of .wrap's side padding with negative margins
     that exactly cancel it — no 100vw/transform (which caused clipping), no mask on
     the nav itself (a mask clips the scroll strip). The soft blend is a separate
     ::after fade layer sitting just below the bar. */
  .nav{position:sticky;top:0;z-index:20;margin:var(--space-6) calc(var(--space-5) * -1) 0;
    padding-top:var(--space-2);padding-bottom:var(--space-3);
    background:var(--color-surface)}
  .nav::after{content:"";position:absolute;left:0;right:0;top:100%;height:var(--space-5);
    pointer-events:none;
    background:linear-gradient(to bottom, var(--color-surface), transparent)}
  /* The horizontal scroll container clips overflow on BOTH axes. Pad it vertically
     by the shadow spread (distance+blur) so the neumorphic shadows fall INSIDE the
     padded box and bleed out freely, then pull the box back with negative margins
     so surrounding layout is unaffected. */
  .nav-inner{display:flex;gap:var(--space-2);overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    padding:calc(var(--nm-distance) + var(--nm-blur)) var(--space-5);
    margin:calc((var(--nm-distance) + var(--nm-blur)) * -1) 0}
  .nav-inner::-webkit-scrollbar{display:none}
  .nav a{flex:0 0 auto;white-space:nowrap;text-decoration:none;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:var(--fs-xs);font-weight:600;letter-spacing:.05em;
    color:var(--color-text-muted);background:var(--nm-bg);border-radius:9999px;
    padding:var(--space-2) var(--space-4);transition:color .15s ease, transform .12s ease;
    box-shadow:var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light)}
  .nav a:hover{transform:translateY(-1px)}
  .nav a:focus-visible{outline:2px solid var(--nm-accent-2);outline-offset:2px}
  /* active tab = pressed/inset well, label in accent-2 */
  .nav a.active{color:#fff;background:var(--nm-accent-2);
    box-shadow:var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light)}
  .nav a.active:hover{transform:translateY(-1px);filter:brightness(1.05)}
  [data-theme="dark"] .nav a.active{color:#1C1E22}
  @media(prefers-reduced-motion:reduce){ .nav a:hover{transform:none} }
  /* demo section anchors */
  .content-sec{margin-top:var(--space-7);scroll-margin-top:72px}
  /* when a section starts with the eyebrow toolbar, don't double the top gap */
  .content-sec > .toolbar:first-child{margin-top:0}

  /* ---- Bolaget & teamet ---- */
  .co-head{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-lg);line-height:var(--lh-snug);letter-spacing:-.01em;color:var(--color-text);margin-bottom:var(--space-1)}
  .co-sub{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:var(--space-5)}
  /* snabbfakta as metadata-list in a pressed well */
  .co-facts{border-radius:16px;padding:var(--space-4) var(--space-5);margin-bottom:var(--space-5);
    box-shadow:inset var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               inset calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light)}
  .co-facts dl{margin:0;display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3) var(--space-5)}
  @media(max-width:520px){ .co-facts dl{grid-template-columns:1fr} }
  .co-fact dt{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:2px}
  .co-fact dd{margin:0;font-size:var(--fs-sm);color:var(--color-text);font-weight:500}
  /* management grid — raised person cards */
  .co-sec-lbl{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--color-text-muted);margin:var(--space-5) 0 var(--space-3)}
  .mgmt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3)}
  @media(max-width:760px){ .mgmt-grid{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:520px){ .mgmt-grid{grid-template-columns:1fr} }
  .person{background:var(--nm-bg);border-radius:16px;padding:var(--space-4);
    box-shadow:var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light)}
  .person .p-n{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-base);color:var(--color-text)}
  .person .p-r{font-size:var(--fs-xs);font-weight:600;color:var(--nm-accent-2);margin:2px 0 var(--space-2);letter-spacing:.02em}
  .person .p-b{font-size:var(--fs-xs);line-height:var(--lh-relaxed);color:var(--color-text-muted)}
  /* board + vision as flat wells */
  .co-block{border-radius:16px;padding:var(--space-4) var(--space-5);margin-top:var(--space-3);
    box-shadow:inset 3px 3px 6px var(--nm-shadow-dark), inset -3px -3px 6px var(--nm-shadow-light)}
  .co-block p{margin:0;font-size:var(--fs-sm);line-height:var(--lh-relaxed);color:var(--color-text)}
  .co-block.vision p{font-style:italic;color:var(--color-text)}
  .co-src{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-xs);color:var(--color-text-muted);margin-top:var(--space-4);line-height:var(--lh-relaxed)}

  /* ---- Pipeline tracker (N programs × N phases) ---- */
  .pl-phasehead{display:grid;gap:var(--space-1);margin:var(--space-4) 0 var(--space-3);padding:0 var(--space-1)}
  .pl-phasehead span{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--color-text-muted);text-align:center}
  .pl-row{margin-bottom:var(--space-4)}
  .pl-rowhead{display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-2);flex-wrap:wrap}
  .pl-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;align-self:center}
  .pl-code{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-sm);color:var(--color-text)}
  .pl-ind{font-size:var(--fs-xs);color:var(--color-text-muted)}
  .pl-track{display:grid;gap:var(--space-1);position:relative}
  .pl-cell{height:16px;border-radius:6px;
    box-shadow:inset 2px 2px 4px var(--nm-shadow-dark), inset -2px -2px 4px var(--nm-shadow-light)}
  .pl-cell.filled{box-shadow:2px 2px 5px var(--nm-shadow-dark), -2px -2px 5px var(--nm-shadow-light)}
  .pl-status{display:inline-block;margin-top:var(--space-2);font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .pl-arrow-line{position:absolute;height:2px;border-radius:1px;top:8px;transform:translateY(-50%);pointer-events:none;opacity:.5}
  .pl-arrow-head{position:absolute;width:0;height:0;top:8px;transform:translateY(-50%);border-top:5px solid transparent;border-bottom:5px solid transparent;pointer-events:none;opacity:.5}
  .pl-legend{display:flex;gap:var(--space-4);flex-wrap:wrap;margin-top:var(--space-4);font-family:'IBM Plex Mono',monospace;font-size:var(--fs-xs);color:var(--color-text-muted)}
  .pl-legend .li{display:flex;align-items:center;gap:var(--space-2)}
  .pl-lg-fill{width:22px;height:10px;border-radius:4px;background:var(--nm-accent-2);box-shadow:1px 1px 3px var(--nm-shadow-dark),-1px -1px 3px var(--nm-shadow-light)}
  .pl-lg-arrow{width:30px;height:10px;position:relative}
  .pl-lg-arrow .l{position:absolute;left:0;right:6px;top:50%;height:2px;background:var(--color-text-muted);transform:translateY(-50%);opacity:.5}
  .pl-lg-arrow .h{position:absolute;right:0;top:50%;width:0;height:0;transform:translateY(-50%);border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid var(--color-text-muted);opacity:.5}

  /* ---- Programmen (grouped program cards) ---- */
  .pr-group{margin-top:var(--space-6)}
  .pr-group-lbl{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--nm-accent-2);margin-bottom:var(--space-1)}
  .pr-group-sub{font-size:var(--fs-xs);color:var(--color-text-muted);margin-bottom:var(--space-3);line-height:var(--lh-relaxed)}
  .pr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3)}
  @media(max-width:640px){ .pr-grid{grid-template-columns:1fr} }
  /* card = raised, with a left accent stripe carrying program colour */
  .pr-card{background:var(--nm-bg);border-radius:16px;padding:var(--space-4) var(--space-4) var(--space-4) var(--space-5);
    position:relative;overflow:hidden;
    box-shadow:var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light)}
  .pr-card::before{content:"";position:absolute;left:0;top:var(--space-4);bottom:var(--space-4);width:4px;border-radius:2px;background:var(--pr-c,var(--nm-accent-2))}
  .pr-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-1)}
  .pr-code{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-base);color:var(--color-text)}
  .pr-metric{text-align:right}
  .pr-metric .m-v{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-sm);color:var(--pr-c,var(--nm-accent-2));line-height:1.2}
  .pr-metric .m-l{font-size:9px;color:var(--color-text-muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.03em}
  .pr-ind{font-size:var(--fs-xs);color:var(--color-text-muted);margin-bottom:var(--space-3)}
  /* metadata list */
  .pr-meta{display:flex;flex-direction:column;gap:var(--space-2)}
  .pr-meta .k{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted)}
  .pr-meta .val{font-size:var(--fs-xs);line-height:var(--lh-relaxed);color:var(--color-text)}
  .pr-meta .val.next{color:var(--nm-accent-2);font-weight:500}
  /* labelled preclinical block */
  .pr-preclin{margin-top:var(--space-3);padding:var(--space-3);border-radius:10px;
    box-shadow:inset 2px 2px 5px var(--nm-shadow-dark), inset -2px -2px 5px var(--nm-shadow-light)}
  .pr-preclin .pc-lbl{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:var(--space-1)}
  .pr-preclin .pc-body{font-size:var(--fs-xs);line-height:var(--lh-relaxed);color:var(--color-text-muted)}
  .pr-src{display:inline-block;margin-top:var(--space-3);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.04em;color:var(--nm-accent-2);text-decoration:none}
  .pr-src:hover{text-decoration:underline}
  .pr-src:focus-visible{outline:2px solid var(--nm-accent-2);outline-offset:2px}

  /* ---- Ekonomi & avtal ---- */
  /* report box: latest (raised, accent-filled) + next (flat well) */
  .rep-box{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:0;margin-top:var(--space-3)}
  @media(max-width:600px){
    .rep-conn{padding:0 var(--space-1);font-size:var(--fs-base)}
    .rep-card{padding:var(--space-3) var(--space-3)}
    .rep-v{font-size:var(--fs-base)}
    .rep-link{font-size:8px}
  }
  .rep-card{border-radius:16px;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-1)}
  .rep-card.latest{background:var(--nm-accent-2);color:#fff;
    box-shadow:var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light)}
  .rep-card.next{box-shadow:inset var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               inset calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light)}
  .rep-badge{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
  .rep-card.latest .rep-badge{color:rgba(255,255,255,.8)}
  .rep-card.next .rep-badge{color:var(--color-text-muted)}
  .rep-v{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-md);line-height:1.1}
  .rep-card.latest .rep-v{color:#fff}.rep-card.next .rep-v{color:var(--color-text)}
  .rep-date{font-size:var(--fs-xs)}
  .rep-card.latest .rep-date{color:rgba(255,255,255,.85)}.rep-card.next .rep-date{color:var(--color-text-muted)}
  .rep-link{margin-top:var(--space-2);font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.04em;text-decoration:none;align-self:flex-start}
  .rep-card.latest .rep-link{color:#fff;background:rgba(255,255,255,.18);padding:5px 11px;border-radius:9999px}
  .rep-card.next .rep-link{color:var(--nm-accent-2)}
  .rep-link:focus-visible{outline:2px solid var(--nm-accent-2);outline-offset:2px}
  .rep-conn{display:flex;align-items:center;justify-content:center;padding:0 var(--space-3);color:var(--color-text-muted);font-size:var(--fs-md)}

  /* deal cards */
  .deal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3);margin-top:var(--space-4)}
  @media(max-width:640px){ .deal-grid{grid-template-columns:1fr} }
  .deal-card{background:var(--nm-bg);border-radius:16px;padding:var(--space-4) var(--space-5);
    box-shadow:var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light)}
  .deal-partner{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-sm);color:var(--color-text)}
  .deal-prog{font-size:var(--fs-xs);color:var(--color-text-muted);margin-bottom:var(--space-3)}
  /* flow stat: upfront → total */
  .deal-flow{display:flex;align-items:flex-end;gap:var(--space-3);margin-bottom:var(--space-2)}
  .deal-flow .fs{flex:1;min-width:0}
  .deal-flow .fs .fl{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:2px}
  .deal-flow .fs .fv{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-sm);color:var(--color-text);line-height:1.15}
  .deal-flow .fs.tot .fv{color:var(--nm-accent-2)}
  .deal-flow .arw{color:var(--color-text-muted);font-size:var(--fs-md);padding-bottom:2px;flex:0 0 auto}
  /* labeled progress bar (read-only ratio) */
  .deal-bar-lbl{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--color-text-muted);margin:var(--space-2) 0 var(--space-1)}
  .deal-bar{height:8px;border-radius:5px;overflow:hidden;
    box-shadow:inset 2px 2px 4px var(--nm-shadow-dark), inset -2px -2px 4px var(--nm-shadow-light)}
  .deal-bar .fill{height:100%;border-radius:5px;background:var(--nm-accent-gradient)}
  /* structure chips (for royalty-driven / uncapped deals instead of a false % bar) */
  .deal-struct{margin-top:var(--space-2);display:flex;flex-direction:column;gap:var(--space-1)}
  .deal-struct .sc{display:flex;align-items:flex-start;gap:var(--space-2);font-size:var(--fs-xs);line-height:var(--lh-relaxed);color:var(--color-text)}
  .deal-struct .sc .mk{flex:0 0 auto;margin-top:1px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600}
  .deal-struct .sc.done .mk{color:var(--nm-accent-2)}
  .deal-struct .sc.pending .mk{color:var(--color-text-muted)}
  .deal-struct .sc.recurring .mk{color:var(--nm-accent-2)}
  .deal-src{display:inline-block;margin-top:var(--space-3);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.04em;color:var(--nm-accent-2);text-decoration:none}
  .deal-src:hover{text-decoration:underline}
  .deal-src:focus-visible{outline:2px solid var(--nm-accent-2);outline-offset:2px}
  .deal-foot{font-size:var(--fs-xs);color:var(--color-text-muted);line-height:var(--lh-relaxed);margin-top:var(--space-4)}
  /* compact deals */
  .dc-head{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--color-text-muted);margin:var(--space-5) 0 var(--space-3)}
  .dc-row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:12px;margin-bottom:var(--space-2);
    box-shadow:inset 2px 2px 5px var(--nm-shadow-dark), inset -2px -2px 5px var(--nm-shadow-light)}
  .dc-row .dc-code{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-sm);color:var(--color-text)}
  .dc-row .dc-note{font-size:var(--fs-xs);color:var(--color-text-muted)}
  .dc-row .dc-v{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-sm);color:var(--nm-accent-2);white-space:nowrap}
  .dc-src{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--nm-accent-2);text-decoration:none}
  .dc-src:focus-visible{outline:2px solid var(--nm-accent-2);outline-offset:2px}

  /* ---- Katalysatorer ---- */
  .cat-list{margin-top:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
  .cat-item{background:var(--nm-bg);border-radius:16px;padding:var(--space-4) var(--space-5);position:relative;overflow:hidden;
    box-shadow:var(--nm-distance) var(--nm-distance) var(--nm-blur) var(--nm-shadow-dark),
               calc(var(--nm-distance) * -1) calc(var(--nm-distance) * -1) var(--nm-blur) var(--nm-shadow-light)}
  .cat-item::before{content:"";position:absolute;left:0;top:var(--space-4);bottom:var(--space-4);width:4px;border-radius:2px;background:var(--cat-c,var(--nm-accent-2))}
  .cat-top{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-2)}
  .cat-when{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted)}
  .cat-chip{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:9999px;
    box-shadow:2px 2px 4px var(--nm-shadow-dark), -2px -2px 4px var(--nm-shadow-light)}
  .cat-chip.internal{color:var(--nm-accent-2)}
  .cat-chip.partner{color:var(--color-text-muted)}
  .cat-chip.mile{color:#fff;background:var(--nm-accent-2);box-shadow:none}
  .cat-chip.crit{color:#fff;background:var(--cat-c,var(--nm-accent-2));box-shadow:none}
  .cat-t{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-base);color:var(--color-text);margin-bottom:var(--space-1)}
  .cat-d{font-size:var(--fs-xs);line-height:var(--lh-relaxed);color:var(--color-text-muted)}
  .cat-src{display:inline-block;margin-top:var(--space-2);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.04em;color:var(--nm-accent-2);text-decoration:none}
  .cat-src:hover{text-decoration:underline}
  .cat-src:focus-visible{outline:2px solid var(--nm-accent-2);outline-offset:2px}
  .cat-src.no{color:var(--color-text-muted);pointer-events:none;text-decoration:none}

  /* ---- Pressmeddelanden (timeline) ---- */
  .tl-list{margin-top:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
  .tl-item{background:var(--nm-bg);border-radius:16px;padding:var(--space-4) var(--space-5);position:relative;overflow:hidden;

    pr:{"eyebrow":{"sv":"Programmen","en":"The programs"},"head":{"sv":"Programmen","en":"The programs"},"sub":{"sv":"Fyra spår med olika risk- och finansieringsprofil","en":"Four tracks with different risk and funding profiles"},"colors":{"san2668":"#3E7C7B","san2465":"#4A5B8C","san2219":"#6B8E6B","san711":"#2C6E8F","san2355":"#9C7A5B","teso":"#3E7C7B","tesomet":"#5B7080","san903":"#6B8E6B","platform":"#54585C"},"groups":[{"key":"internal","name":{"sv":"Interna helägda program","en":"Internal wholly-owned programs"},"sub":{"sv":"Full uppsida — Saniona bär kostnad och risk","en":"Full upside — Saniona carries cost and risk"},"cards":[{"key":"san2668","code":"SAN2668","status":"filing","metricV":{"sv":"Q1 2027","en":"Q1 2027"},"metricL":{"sv":"first-in-human-dosering","en":"first-in-human dosing"},"ind":{"sv":"Svåra pediatriska epilepsier (DEE)","en":"Severe paediatric epilepsies (DEE)"},"mech":{"sv":"GABAA α2/α3-selektiv positiv allosterisk modulator (PAM) med balanserad α1 — bevarar bensodiazepiners anfallseffekt men minimerar sedering, kognitiv påverkan och beroende","en":"GABAA α2/α3-selective positive allosteric modulator (PAM) with balanced α1 — preserves benzodiazepine-class anti-seizure efficacy while minimising sedation, cognitive impact and dependence"},"partner":{"sv":"Helägt av Saniona","en":"Wholly owned by Saniona"},"patent":{"sv":"Substanspatent in på 2040-talet","en":"Compound patent into the 2040s"},"preclin":{"sv":"Överlägsen anfallskontroll jämfört med klobazam vid kliniskt jämförbar exponering, utan motorisk påverkan eller sedering. Undertrycker spike-wave-urladdningar (SWD) i tre genetiskt distinkta DEE-modeller (SYNGAP1, STXBP1, CHD2) samt i GAERS-råttmodellen. Förbättrar även icke-anfallssymtom — kognition, aggression och social interaktion. Additiv effekt med lamotrigin, levetiracetam och valproat.","en":"Superior seizure control versus clobazam at clinically comparable exposure, with no motor impairment or sedation. Suppresses spike-wave discharges (SWD) across three genetically distinct DEE models (SYNGAP1, STXBP1, CHD2) and in the GAERS rat model. Also improves non-seizure symptoms — cognition, aggression and social interaction. Additive with lamotrigine, levetiracetam and valproate."},"summary":{"sv":"Huvudkandidaten och ett av de två program som ligger närmast klinik. Först-i-klassen för barn med svårbehandlad, ofta läkemedelsresistent epilepsi. Bolaget ser potential att utveckla SAN2668 brett över flera DEE-syndrom snarare än en enskild indikation.","en":"The lead candidate and one of the two programs closest to the clinic. First-in-class for children with hard-to-treat, often drug-resistant epilepsy. The company sees potential to develop SAN2668 broadly across several DEE syndromes rather than a single indication."},"latest":{"sv":"GLP-toxikologi klar; CTA-ansökan väntas kring årsskiftet 2026. Ledningen har lyft potential för Orphan Drug- och Rare Pediatric Disease-designation. Egen investerarwebbinarie hölls 17 juni 2026.","en":"GLP toxicology complete; CTA submission expected around year-end 2026. Management has flagged potential for Orphan Drug and Rare Pediatric Disease designation. A dedicated investor webinar was held on 17 June 2026."},"next":{"sv":"CTA-ansökan kring årsskiftet 2026 → first-in-human-dosering Q1 2027","en":"CTA submission around year-end 2026 → first-in-human dosing Q1 2027"},"href":"https://mfn.se/a/saniona/saniona-valjer-san2668-som-forst-i-klassen-klinisk-kandidat-for-pediatrisk-epilepsi"},{"key":"san2465","code":"SAN2465","status":"filing","metricV":{"sv":"Kring årsskiftet 2026","en":"Around year-end 2026"},"metricL":{"sv":"first-in-human-dosering","en":"first-in-human dosing"},"ind":{"sv":"Svår depression (MDD)","en":"Major depressive disorder (MDD)"},"mech":{"sv":"Negativ allosterisk modulator (NAM) av GABAA α5 — ny mekanism, skild från antidepressiva, NMDA-antagonister och psykedelika","en":"Negative allosteric modulator (NAM) of GABAA α5 — a novel mechanism, distinct from antidepressants, NMDA antagonists and psychedelics"},"partner":{"sv":"Helägt av Saniona","en":"Wholly owned by Saniona"},"patent":{"sv":"Substanspatent in på 2040-talet","en":"Compound patent into the 2040s"},"preclin":{"sv":"Anhedoni normaliserad inom 24 timmar och kvarstående i minst 48 timmar efter en enda oral dos; ångestbeteende fullt reverserat. Effektstorlek jämförbar med ketamin, där konventionella antidepressiva kräver 3–5 veckors daglig dosering. Återställer kognition i två domäner och två oberoende modeller (jämförbart med ketamin/donepezil) utan påverkan på motorik. Anatomiskt begränsad målverkan (hippocampus) bekräftad med PET i primat.","en":"Anhedonia normalised within 24 hours and sustained for at least 48 hours after a single oral dose; anxiety-like behaviour fully reversed. Effect size comparable to ketamine, where conventional antidepressants need 3–5 weeks of daily dosing. Restores cognition across two domains and two independent models (comparable to ketamine/donepezil) with no effect on locomotor activity. Anatomically restricted target engagement (hippocampus) confirmed by PET in non-human primates."},"summary":{"sv":"Potentiell först-i-klassen-behandling med snabb och långvarig antidepressiv effekt i prekliniska modeller. Doserar först av de interna programmen.","en":"Potential first-in-class treatment with rapid, durable antidepressant effect in preclinical models. First of the internal programs to dose."},"latest":{"sv":"In-life-fasen för IND-förberedande toxikologi klar; GMP-batch förbereds för första studierna på människa i USA. En R&D Day för SAN2465 planeras under Q4 2026, kring CTA-ansökan.","en":"In-life phase completed for IND-enabling tox studies; GMP batch in preparation for first-in-human studies in the US. An R&D Day for SAN2465 is planned for Q4 2026, around the CTA submission."},"next":{"sv":"First-in-human-dosering kring årsskiftet 2026","en":"First-in-human dosing around year-end 2026"},"href":"https://mfn.se/a/saniona/     // company section
    const co=DATA.co;
    document.getElementById('coHead').textContent=tr(co.head);
    document.getElementById('coSub').textContent=tr(co.sub);

    document.getElementById('coMgmtLbl').textContent=tr(co.mgmtLbl);
    document.getElementById('mgmtGrid').innerHTML=tr(co.mgmt).map(p=>`<div class="person"><div class="p-n">${p.n}</div><div class="p-r">${p.r}</div><div class="p-b">${p.b}</div></div>`).join('');
    document.getElementById('coBoardLbl').textContent=tr(co.boardLbl);
    document.getElementById('coBoard').innerHTML=`<p>${tr(co.board)}</p>`;
    document.getElementById('coVisionLbl').textContent=tr(co.visionLbl);
    document.getElementById('coVision').innerHTML=`<p>${tr(co.vision)}</p>`;
    document.getElementById('coSrc').textContent=tr(co.src);
    renderPipeline();
    renderPrograms();
    renderEcon();
    renderCatalysts();
    renderTimeline();
    renderRisks();
    renderFooter();
    buildNav();

    const r=DATA.risk;
    document.getElementById('riskEyebrow').textContent=tr(r.eyebrow);
    document.getElementById('riskHead').textContent=tr(r.head);
    document.getElementById('riskSub').textContent=tr(r.sub);

      `<div class="risk-item"><div class="risk-h">${x.h}</div><div class="risk-d">${x.d}</div></div>`).join('');

    const f=DATA.foot;
    const dc=DATA.discord;
    if(dc){
      document.getElementById('dcLbl').textContent=tr(dc.lbl);
      document.getElementById('dcHead').textContent=tr(dc.head);
      document.getElementById('dcLine').textContent=tr(dc.line);
      document.getElementById('dcBtnTxt').textContent=tr(dc.btn);
      const b=document.getElementById('dcBtn'); b.href=dc.href;
    }
    const inz=DATA.install;
    if(inz){
      document.getElementById('inLbl').textContent=tr(inz.lbl);
      document.getElementById('inHead').textContent=tr(inz.head);
      document.getElementById('inLine').textContent=tr(inz.line);
      document.getElementById('inBtnTxt').textContent=tr(inz.btn);
    }
    document.getElementById('footSources').textContent=tr(f.footer);
    const pl=document.getElementById('footPresLink');
    pl.textContent='↗ '+tr(f.presLink); pl.href=f.presHref;
    document.getElementById('footDisclaimer').textContent=tr(f.disclaimer);
    const cov=document.getElementById('footCoverage');
    if(cov&&f.coverage){ const cv=tr(f.coverage);
      cov.innerHTML=`${cv.pre}<a class="foot-cov-link" href="${cv.href}" target="_blank" rel="noopener">${cv.link}</a>${cv.post}`; }
    const bu=document.getElementById('brandUpdated'); if(bu) bu.textContent=tr(f.updated);

  function renderTimeline(){
    const tl=DATA.tl, L=tl.labels, colors=DATA.pr.colors;
    document.getElementById('tlEyebrow').textContent=tr(L.tlHead);
    document.getElementById('tlHead').textContent=tr(L.tlHead);
    document.getElementById('tlSub').textContent=tr(L.tlSub);
    document.getElementById('tlList').innerHTML=tl.timeline.map(t=>{
      const col=colors[t.key]||'var(--nm-accent-2)';
      const src=t.href?`<a class="tl-src" href="${t.href}" target="_blank" rel="noopener">↗ ${lang==='sv'?'Läs mer':'Read more'}</a>`:'';
      return `<div class="tl-item" style="--tl-c:${col}">
        <div class="tl-top"><span class="tl-date">${tr(t.date)}</span></div>
        <div class="tl-title">${tr(t.title)}</div>
        ${src}
      </div>`;
    }).join('');
  }

  function renderCatalysts(){
    const cat=DATA.cat, L=cat.labels, colors=DATA.pr.colors;
    document.getElementById('catEyebrow').textContent=tr(L.watchHead);
    document.getElementById('catHead').textContent=tr(L.watchHead);
    document.getElementById('catSub').textContent=tr(L.watchSub);
    document.getElementById('catList').innerHTML=cat.catalysts.map(c=>{
      const col=colors[c.key]||'var(--nm-accent-2)';
      const tagCls=c.tag==='partner'?'partner':'internal';
      const tagTxt=c.tag==='partner'?tr(L.catPartner):tr(L.catInternal);
      const chips=[];
      chips.push(`<span class="cat-chip ${tagCls}">${tagTxt}</span>`);
      if(c.crit) chips.push(`<span class="cat-chip crit" style="--cat-c:${col};background:${col}">${tr(L.critLbl)}</span>`);
      if(c.mile) chips.push(`<span class="cat-chip mile">${tr(c.mile)}</span>`);
      const src = c.src ? (c.srcHref
        ? `<a class="cat-src" href="${c.srcHref}" target="_blank" rel="noopener">${tr(L.source)}: ${tr(c.src)} ↗</a>`
        : `<span class="cat-src no">${tr(L.source)}: ${tr(c.src)}</span>`) : '';
      return `<div class="cat-item" style="--cat-c:${col}">
        <div class="cat-top"><span class="cat-when">${tr(c.when)}</span>${chips.join('')}</div>
        <div class="cat-t">${tr(c.t)}</div>
        <div class="cat-d">${tr(c.d)}</div>
        ${src}
      </div>`;
    }).join('');
  }

  function renderEcon(){
    const ec=DATA.ec, L=ec.labels;
    document.getElementById('ecEyebrow').textContent=tr(L.dealHead);
    document.getElementById('ecHead').textContent=tr(L.dealHead);
    document.getElementById('ecSub').textContent=tr(L.dealSub);
    // report box
    document.getElementById('ecRepHead').textContent=tr(L.repHead);
    const rp=ec.reports;
    document.getElementById('ecRepBox').innerHTML=`
      <div class="rep-card latest">
        <span class="rep-badge">${tr(L.repLatest)}</span>
        <span class="rep-v">${tr(rp.latest.label)}</span>
        <span class="rep-date">${tr(rp.latest.date)}</span>
        <a class="rep-link" href="${rp.latest.href}" target="_blank" rel="noopener">${tr(L.repRead)} →</a>
      </div>
      <div class="rep-conn" aria-hidden="true">→</div>
      <div class="rep-card next">
        <span class="rep-badge">${tr(L.repNext)}</span>
        <span class="rep-v">${tr(rp.next.label)}</span>
        <span class="rep-date">${tr(rp.next.date)}</span>
        <a class="rep-link" href="${rp.next.href}" target="_blank" rel="noopener">${tr(L.repCal)} →</a>
      </div>`;
    // deal cards
    document.getElementById('ecDealGrid').innerHTML=ec.deals.map(d=>{
      const partner = typeof d.partner==='string'?d.partner:tr(d.partner);
      const prog = typeof d.prog==='string'?d.prog:tr(d.prog);
      const flow = `<div class="deal-flow">
          <div class="fs"><div class="fl">${tr(L.dealUpLbl)}</div><div class="fv">${tr(d.upDisp)}</div></div>
          <div class="arw">→</div>
          <div class="fs tot"><div class="fl">${tr(L.dealTotLbl)}</div><div class="fv">${tr(d.totDisp)}</div></div>
        </div>`;
      let body;
      if(d.capped){
        const pct = Math.max(2,Math.min(100, Math.round(d.up/d.tot*100)));
        body = `<div class="deal-bar-lbl"><span>${tr(L.dealBarLbl)}</span><span>${pct}%</span></div>
          <div class="deal-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${tr(L.dealBarLbl)}"><div class="fill" style="width:${pct}%"></div></div>`;
      } else if(d.structure){
        // honest structure breakdown instead of a false %: done ✓ / pending ○ / recurring ↻
        const rows = tr(d.structure).map((line,idx)=>{
          const low=line.toLowerCase();
          let cls='pending', mk='○';
          if(/erhållet|received|✓/.test(low)){cls='done';mk='✓';}
          else if(/royalt|löpande|recurring|forskningsfinansiering|research funding/.test(low)){cls='recurring';mk='↻';}
          return `<div class="sc ${cls}"><span class="mk">${mk}</span><span>${line}</span></div>`;
        }).join('');
        body = `<div class="deal-struct">${rows}</div>`;
      } else {
        body = '';
      }
      return `<div class="deal-card">
        <div class="deal-partner">${partner}</div>
        <div class="deal-prog">${prog}</div>
        ${flow}
        ${body}
        ${d.src?`<a class="deal-src" href="${d.src}" target="_blank" rel="noopener">↗ ${lang==='sv'?'Källa':'Source'}</a>`:''}
      </div>`;
    }).join('');
    document.getElementById('ecDealFoot').textContent=tr(L.dealFoot);
    // compact deals
    document.getElementById('ecCompactHead').textContent=tr(L.dealCompactHead);
    document.getElementById('ecCompact').innerHTML=ec.dealsCompact.map(d=>{
      const name = typeof d.partner==='string'?d.partner:tr(d.partner);
      const desc = d.desc?tr(d.desc):'';
      const src = d.src?` <a class="dc-src" href="${d.src}" target="_blank" rel="noopener" aria-label="${lang==='sv'?'Källa':'Source'}">↗</a>`:'';
      return `<div class="dc-row"><div><div class="dc-code">${name}${src}</div><div class="dc-note">${desc}</div></div><div class="dc-v">${tr(d.value)}</div></div>`;
    }).join('');
  }

    const L={mech:{sv:'Mekanism',en:'Mechanism'},ind:{sv:'Indikation',en:'Indication'},patent:{sv:'Patent',en:'Patent'},partner:{sv:'Ägande',en:'Ownership'},next:{sv:'Nästa',en:'Next'},preclin:{sv:'Preklinisk data (Sanionas presentation)',en:'Preclinical data (Saniona presentation)'},src:{sv:'Källa ↗',en:'Source ↗'}};
    const wrap=document.getElementById('prGroups');
    wrap.innerHTML=pr.groups.map(g=>{
      const cards=g.cards.map(c=>{
        const col=pr.colors[c.key]||'var(--nm-accent-2)';
        const meta=[];
        if(c.ind) meta.push(`<div><div class="k">${tr(L.ind)}</div><div class="val">${tr(c.ind)}</div></div>`);
        if(c.mech) meta.push(`<div><div class="k">${tr(L.mech)}</div><div class="val">${tr(c.mech)}</div></div>`);
        if(c.partner) meta.push(`<div><div class="k">${tr(L.partner)}</div><div class="val">${tr(c.partner)}</div></div>`);
        if(c.patent) meta.push(`<div><div class="k">${tr(L.patent)}</div><div class="val">${tr(c.patent)}</div></div>`);
        if(c.next) meta.push(`<div><div class="k">${tr(L.next)}</div><div class="val next">${tr(c.next)}</div></div>`);
        const preclin=c.preclin?`<div class="pr-preclin"><div class="pc-lbl">${tr(L.preclin)}</div><div class="pc-body">${tr(c.preclin)}</div></div>`:'';
        const src=c.href?`<a class="pr-src" href="${c.href}" target="_blank" rel="noopener">${tr(L.src)}</a>`:'';
        const codeTxt = typeof c.code==='string'?c.code:tr(c.code);
        return `<div class="pr-card" style="--pr-c:${col}">
          <div class="pr-top"><span class="pr-code">${codeTxt}</span>
            <span class="pr-metric"><span class="m-v">${tr(c.metricV)}</span><br><span class="m-l">${tr(c.metricL)}</span></span></div>
          ${c.summary?`<div class="pr-ind">${tr(c.summary)}</div>`:''}
          <div class="pr-meta">${meta.join('')}</div>
          ${preclin}${src}
        </div>`;
      }).join('');
      return `<div class="pr-group">
        <div class="pr-group-lbl">${tr(g.name)}</div>
        <div class="pr-group-sub">${tr(g.sub)}</div>
        <div class="pr-grid">${cards}</div>
      </div>`;
    }).join('');
  }

  // ---- accessible category color generator (contrast-checked against current bg) ----
  function hslToRgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12;const a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];}
  function srgbLin(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
  function relLum([r,g,b]){return 0.2126*srgbLin(r)+0.7152*srgbLin(g)+0.0722*srgbLin(b);}
  function contrast(a,b){const l1=relLum(a),l2=relLum(b);return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);}
  function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function rgbHex(a){return '#'+a.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');}
  function catColor(index,bgHex,target=4.6){
    const hue=(165+index*137.508)%360, sat=55;
    const darken=relLum(hexRgb(bgHex))>0.4; let L=50;
    for(let i=0;i<90;i++){const rgb=hslToRgb(hue,sat,L);if(contrast(rgb,hexRgb(bgHex))>=target)return rgbHex(rgb);L+=darken?-1:1;if(L<4||L>96)break;}
    return rgbHex(hslToRgb(hue,sat,darken?15:85));
  }
  function curBg(){return getComputedStyle(document.documentElement).getPropertyValue('--nm-bg').trim()||'#ECF0F3';}

  function renderPipeline(){
    const pl=DATA.pl, phases=tr(pl.phases), bg=curBg();
    document.getElementById('plHead').textContent=tr(pl.head);
    document.getElementById('plSub').textContent=pl.subTpl[lang](pl.programs.length, phases.length);
    document.getElementById('plLegFill').textContent=tr(pl.legendFill);
    document.getElementById('plLegArrow').textContent=tr(pl.legendArrow);
    const ph=document.getElementById('plPhaseHead');
    ph.style.gridTemplateColumns=`repeat(${phases.length},1fr)`;
    ph.innerHTML=phases.map(p=>`<span>${p}</span>`).join('');
    const list=document.getElementById('plList');
    list.innerHTML='';
    pl.programs.forEach((p,i)=>{
      const color=catColor(i,bg);
      const row=document.createElement('div'); row.className='pl-row';
      const cells=phases.map((_,idx)=>{
        const filled=idx<=p.cur;
        return `<div class="pl-cell${filled?' filled':''}"${filled?` style="background:${color}"`:''}></div>`;
      }).join('');
      row.innerHTML=`
        <div class="pl-rowhead"><span class="pl-dot" style="background:${color}"></span>
          <span class="pl-code">${p.code}</span><span class="pl-ind">${tr(p.ind)}</span></div>
        <div class="pl-track" style="grid-template-columns:repeat(${phases.length},1fr)">${cells}</div>
        <span class="pl-status" style="color:${color}">${tr(p.status)}</span>`;
      list.appendChild(row);
      row._arrow=(p.target!=null && p.target>p.cur)?{from:p.cur,to:p.target,color}:null;
    });
    requestAnimationFrame(drawPlArrows);
  }
  function drawPlArrows(){
    document.querySelectorAll('.pl-arrow-line,.pl-arrow-head').forEach(e=>e.remove());
    document.querySelectorAll('.pl-row').forEach(row=>{
      const d=row._arrow; if(!d) return;
      const track=row.querySelector('.pl-track'), cells=track.querySelectorAll('.pl-cell');
      const fc=cells[d.from], tc=cells[d.to]; if(!fc||!tc) return;
      const startX=fc.offsetLeft+fc.offsetWidth, endX=tc.offsetLeft+tc.offsetWidth/2;
      const line=document.createElement('div'); line.className='pl-arrow-line';
      line.style.left=startX+'px'; line.style.width=Math.max(0,endX-startX-7)+'px'; line.style.background=d.color;
      const head=document.createElement('div'); head.className='pl-arrow-head';
      head.style.left=(endX-7)+'px'; head.style.borderLeft=`7px solid ${d.color}`;
      track.appendChild(line); track.appendChild(head);
    });
  }
  window.addEventListener('resize',()=>requestAnimationFrame(drawPlArrows),{passive:true});

  // ---- scroll-spy nav ----
  function buildNav(){
    const inner=document.getElementById('navInner');
    inner.innerHTML = DATA.nav[lang].map(([id,label])=>
      `<a data-target="${id}" ${id==='__all'?'class="active"':''}>${label}</a>`).join('');
    inner.querySelectorAll('a').forEach(a=>{
      a.addEventListener('click',e=>{
        e.preventDefault();
        const t=a.dataset.target;
        if(t==='__all'){ window.scrollTo({top:0,behavior:'smooth'}); }
        else{ const s=document.getElementById(t);
          if(s){ const navH=document.querySelector('.nav').offsetHeight;
            const y=s.getBoundingClientRect().top+window.pageYOffset-navH-4;
            window.scrollTo({top:Math.max(0,y),behavior:'smooth'}); } }
        setActive(t,true);
      });
    });
  }
  let activeTarget='__all';
  function setActive(t,center){
    if(t===activeTarget && !center) return;
    activeTarget=t;
    const inner=document.getElementById('navInner');
    let activeEl=null;
    inner.querySelectorAll('a').forEach(a=>{
      const on=a.dataset.target===t; a.classList.toggle('active',on); if(on)activeEl=a;
    });
    if(center && activeEl){
      const target=activeEl.offsetLeft-(inner.clientWidth/2)+(activeEl.offsetWidth/2);
      const max=inner.scrollWidth-inner.clientWidth;
      inner.scrollTo({left:Math.max(0,Math.min(max,target)),behavior:'smooth'});
    }
  }
  const spySections=['bolaget','pipeline','program','ekonomi','bevaka','proof','risker','community'];
  function spy(){
    const navH=document.querySelector('.nav').offsetHeight;
    const probe=window.pageYOffset+navH+12;
    let cur='__all';
    for(const id of spySections){ const s=document.getElementById(id); if(s && s.offsetTop<=probe) cur=id; }
    const first=document.getElementById(spySections[0]);
    if(first && window.pageYOffset < first.offsetTop-navH-40) cur='__all';
    if((window.innerHeight+window.pageYOffset)>=(document.body.scrollHeight-4)) cur=spySections[spySections.length-1];
    if(cur!==activeTarget) setActive(cur,true);
  }
  window.addEventListener('scroll',spy,{passive:true});
  window.addEventListener('resize',spy,{passive:true});

  render();
  spy();

  // language segmented control
  const svBtn=document.getElementById('langSv'), enBtn=document.getElementById('langEn');
  function setLang(l){
    lang=l; document.documentElement.lang=l;
    svBtn.classList.toggle('on', l==='sv'); enBtn.classList.toggle('on', l==='en');
    svBtn.setAttribute('aria-pressed', l==='sv'); enBtn.setAttribute('aria-pressed', l==='en');
    render(); setActive(activeTarget,false);
  }
  svBtn.addEventListener('click',()=>setLang('sv'));
  enBtn.addEventListener('click',()=>setLang('en'));

  const btn=document.getElementById('themeBtn');
  btn.addEventListener('click',()=>{
    const dark = document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme', dark?'light':'dark');
    btn.textContent = dark ? '☾' : '☀';
    setTimeout(renderPipeline,0); // recompute category colors against the new background
  });
  // starta alltid i ljust läge (växlas manuellt till mörkt via knappen)
  document.documentElement.setAttribute('data-theme','light');
  btn.textContent='☾';

  // ---- brand mesh logo (WebGL2, pointer-deformable; falls back to text) ----
  function initBrandMesh(wrapId,canvasId){
    const wrap=document.getElementById(wrapId||'brandMesh'), canvas=document.getElementById(canvasId||'brandCanvas');
    if(!wrap||!canvas) return;
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--nm-accent-2').trim() || '#32496F';
    const gl=canvas.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:true});
    if(!gl) return;
    const VERT=`#version 300 es
    in vec2 aPos; in vec2 aUv; in vec2 aDisp; out vec2 vUv;
    void main(){ gl_Position=vec4(aPos+aDisp,0.,1.); vUv=aUv; }`;
    const FRAG=`#version 300 es
    precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D t;
    void main(){ o=texture(t,vUv); }`;
    const cs=(ty,s)=>{const sh=gl.createShader(ty);gl.shaderSource(sh,s);gl.compileShader(sh);return gl.getShaderParameter(sh,gl.COMPILE_STATUS)?sh:null;};
    const vs=cs(gl.VERTEX_SHADER,VERT), fs=cs(gl.FRAGMENT_SHADER,FRAG); if(!vs||!fs) return;
    const pr=gl.createProgram(); gl.attachShader(pr,vs); gl.attachShader(pr,fs); gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) return;
    const GW=80,GH=24,vc=(GW+1)*(GH+1);
    const pos=new Float32Array(vc*2),uv=new Float32Array(vc*2);
    for(let y=0;y<=GH;y++)for(let x=0;x<=GW;x++){const i=y*(GW+1)+x,u=x/GW,v=y/GH;pos[i*2]=u*2-1;pos[i*2+1]=1-v*2;uv[i*2]=u;uv[i*2+1]=v;}
    const idx=new Uint32Array(GW*GH*6);let k=0;
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const a=y*(GW+1)+x,b=a+1,c=a+(GW+1),d=c+1;idx[k++]=a;idx[k++]=c;idx[k++]=b;idx[k++]=b;idx[k++]=c;idx[k++]=d;}
    const disp=new Float32Array(vc*2),vel=new Float32Array(vc*2);
    const aP=gl.getAttribLocation(pr,'aPos'),aU=gl.getAttribLocation(pr,'aUv'),aD=gl.getAttribLocation(pr,'aDisp'),uT=gl.getUniformLocation(pr,'t');
    const vao=gl.createVertexArray();gl.bindVertexArray(vao);
    const pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,pos,gl.STATIC_DRAW);gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
    const ub=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,ub);gl.bufferData(gl.ARRAY_BUFFER,uv,gl.STATIC_DRAW);gl.enableVertexAttribArray(aU);gl.vertexAttribPointer(aU,2,gl.FLOAT,false,0,0);
    const dbf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,dbf);gl.bufferData(gl.ARRAY_BUFFER,disp,gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(aD);gl.vertexAttribPointer(aD,2,gl.FLOAT,false,0,0);
    const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
    const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    async function buildTex(){
      const w=Math.max(2,canvas.width),h=Math.max(2,canvas.height),dpr=window.devicePixelRatio||1;
      let size=Math.round((h/dpr*0.7)*dpr);
      try{if(document.fonts){await document.fonts.load(`700 ${size}px 'Space Grotesk'`);await document.fonts.ready;}}catch(e){}
      const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');
      const pad=6*dpr,maxW=w-pad*2;cx.font=`700 ${size}px 'Space Grotesk',sans-serif`;
      let tw=cx.measureText('Saniona Investor').width;
      if(tw>maxW&&tw>0){size=Math.floor(size*(maxW/tw));cx.font=`700 ${size}px 'Space Grotesk',sans-serif`;}
      cx.clearRect(0,0,w,h);cx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--nm-accent-2').trim()||accent;
      cx.textAlign='left';cx.textBaseline='middle';cx.fillText('Saniona Investor',pad,h/2);
      gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);wrap.classList.add('gl-on');
    }
    function resize(){const dpr=window.devicePixelRatio||1,r=wrap.getBoundingClientRect();
      const w=Math.max(2,Math.round(r.width*dpr)),h=Math.max(2,Math.round(r.height*dpr));
      if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);buildTex();}}
    new ResizeObserver(resize).observe(wrap); resize(); buildTex();
    // rebuild texture on theme change so the logo re-colours
    new MutationObserver(buildTex).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
    const cur={x:99,y:99,px:99,py:99,vx:0,vy:0,inside:false};
    wrap.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();const x=((e.clientX-r.left)/r.width)*2-1,y=1-((e.clientY-r.top)/r.height)*2;if(!cur.inside){cur.px=x;cur.py=y;cur.inside=true;}cur.x=x;cur.y=y;});
    wrap.addEventListener('pointerleave',()=>{cur.inside=false;cur.x=99;cur.y=99;cur.vx=0;cur.vy=0;});
    function tick(){cur.vx=cur.x-cur.px;cur.vy=cur.y-cur.py;if(Math.hypot(cur.vx,cur.vy)>0.3){cur.vx=0;cur.vy=0;}cur.px=cur.x;cur.py=cur.y;
      for(let i=0;i<vc;i++){const i2=i*2,px=pos[i2],py=pos[i2+1],dx=disp[i2],dy=disp[i2+1];
        const cd=Math.hypot(cur.x-(px+dx),cur.y-(py+dy)),prox=Math.max(0,1/(1+cd/0.05)-0.1);
        let vx=vel[i2],vy=vel[i2+1];vx+=cur.vx*1.5*prox;vy+=cur.vy*1.5*prox;vx-=dx*0.08;vy-=dy*0.08;vx*=0.9;vy*=0.9;
        vel[i2]=vx;vel[i2+1]=vy;disp[i2]=Math.max(-1,Math.min(1,dx+vx*0.1));disp[i2+1]=Math.max(-1,Math.min(1,dy+vy*0.1));}
      gl.bindBuffer(gl.ARRAY_BUFFER,dbf);gl.bufferSubData(gl.ARRAY_BUFFER,0,disp);
      gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(pr);
      gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(uT,0);
      gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.bindVertexArray(vao);
      gl.drawElements(gl.TRIANGLES,idx.length,gl.UNSIGNED_INT,0);requestAnimationFrame(tick);}
    requestAnimationFrame(tick);
  }
  initBrandMesh('brandMesh','brandCanvas');

  /* ---- PWA: register an inline service worker (network-first = always fresh) ----
     Kept inline via a Blob so the page stays a single self-contained file.
     Strategy: try the network first; only fall back to cache when offline.
     This makes the site installable as an app on desktop + mobile while never
     showing stale investor data when a connection is available. */
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE = 'saniona-investor-v1';
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
      self.addEventListener('fetch', e => {
        if (e.request.method !== 'GET') return;
        e.respondWith(
          fetch(e.request)
            .then(res => {
              const copy = res.clone();
              caches.open(CACHE).then(c => c.put(e.request, copy)).catch(()=>{});
              return res;
            })
            .catch(() => caches.match(e.request))
        );
      });
    `;
    try {
      const blob = new Blob([swCode], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).catch(()=>{});
    } catch(e) {}
  }

  /* ---- Install-app button: one-click on Chrome/Edge/Android, guidance on iOS ---- */
  (function(){
    const btn=document.getElementById('inBtn'), hint=document.getElementById('inHint');
    if(!btn) return;
    const inz=DATA.install;
    let deferredPrompt=null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);

    if(isStandalone){
      // already running as an installed app — reflect that, disable the button
      btn.textContent=''; btn.disabled=true; btn.style.opacity='.6'; btn.style.cursor='default';
      const span=document.createElement('span'); span.textContent=tr(inz.installed); btn.appendChild(span);
      return;
    }

    // Chrome/Edge/Android fire this when the app is installable — capture it for one-click install
    window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); deferredPrompt=e; });

    btn.addEventListener('click', async ()=>{
      if(deferredPrompt){
        deferredPrompt.prompt();
        try{ await deferredPrompt.userChoice; }catch(e){}
        deferredPrompt=null;
        return;
      }
      // No native prompt (iOS Safari, or already dismissed) — show short instructions
      hint.textContent = isIos ? tr(inz.hintIos) : tr(inz.hintOther);
      hint.hidden=false;
    });
  })();
</script>
