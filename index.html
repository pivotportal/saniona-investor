<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saniona Investor</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YLZTC4LT7P"></script>
<script>
  window.dataLayer = window.dataLayer || [];

</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA;          /* sval off-white sidbakgrund */
    --card:#FFFFFF;        /* vita kort */
    --ink:#1A1D21;         /* grafit brödtext */
    --ink-soft:#4B5158;    /* dämpad text */
    --ink-faint:#8A9199;   /* captions / mono-etiketter */
    --line:#E4E8EE;        /* hårlinjer */
    --line-soft:#EEF1F5;
    --accent:#3E5C8C;      /* neutral bolagsblå för icke-programsektioner */
    --shell:#EDF0F4;       /* lätt panel (t.ex. sticky katalysatorer) */
    --shell-line:#DEE3EA;
    --pos:#1E9E5A;         /* positiv kursreaktion */
    --neg:#D0524B;         /* negativ kursreaktion */
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Hanken Grotesk',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;
    overflow-x:hidden;
  }
  a{color:inherit}
  .mono{font-family:'IBM Plex Mono',monospace}
  .display{font-family:'Space Grotesk',sans-serif}

  .topbar{height:3px;background:var(--accent)}

  /* ---------- STICKY NAV ---------- */
  .navbar{position:sticky;top:0;z-index:50;background:rgba(247,248,250,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);box-shadow:0 1px 8px rgba(30,40,60,.04);margin-left:-48px;margin-right:-48px}
  .navbar-scroll{position:relative;max-width:1180px;margin:0 auto}
  /* Toning i högerkanten som antyder att menyn fortsätter */
  .navbar-scroll::after{content:"";position:absolute;top:0;right:0;bottom:0;width:40px;background:linear-gradient(to right,rgba(247,248,250,0),rgba(247,248,250,.95));pointer-events:none;z-index:2}
  .navbar-inner{padding:12px 48px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth}
  .navbar-inner::-webkit-scrollbar{display:none}
  .navlink{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);text-decoration:none;padding:9px 17px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);transition:.15s;white-space:nowrap}
  .navlink .navnum{font-size:9px;opacity:.55;font-weight:700}
  .navlink:hover{color:var(--accent);border-color:var(--accent)}
  .navlink.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(62,92,140,.28)}
  .navlink-all{border-style:solid;border-color:var(--ink-faint)}
  .navlink-all::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:1px;opacity:.55}
  .sec-hidden{display:none !important}
  .navlink.active .navnum{opacity:.7}
  /* Offset så ankarhopp inte hamnar under den klistrade menyn */
  .section,[id]{scroll-margin-top:70px}
  .page{max-width:1180px;margin:0 auto;padding:0 48px 72px}

  /* ---------- HEADER ---------- */
  .head{padding:44px 0 34px;border-bottom:1px solid var(--line)}
  .head-row{display:flex;justify-content:space-between;align-items:center;gap:24px}
  .brand{min-width:0;flex:1 1 auto}
  .brand-mesh{position:relative;width:100%;max-width:560px;height:64px;margin-bottom:2px;margin-left:-14px;user-select:none;cursor:default}
  .brand-mesh canvas{display:block;width:100%;height:100%}
  .brand-mesh .brand-fallback{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:44px;letter-spacing:-.02em;color:var(--accent);line-height:1.1;position:absolute;inset:0;display:flex;align-items:center;white-space:nowrap;padding-left:14px}
  .brand-mesh.gl-on .brand-fallback{opacity:0;pointer-events:none}
  .brand-sub{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px;letter-spacing:.04em;color:var(--ink-faint);margin-top:5px}
  .ticker{color:var(--ink-faint);text-decoration:none;border-bottom:1px solid var(--line);transition:.15s}
  .ticker:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .head-meta{display:flex;align-items:center;gap:16px;flex:0 0 auto}
  .updated{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint)}
  .langtog{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
  .langtog button{border:none;padding:6px 14px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.05em;background:transparent;color:var(--ink-faint);transition:.15s}
  .langtog button.on{background:var(--accent);color:#fff}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:46px;line-height:1.07;letter-spacing:-.02em;margin-top:26px;max-width:920px}
  .sub{font-size:16.5px;line-height:1.6;color:var(--ink-soft);margin-top:16px;max-width:680px}

  .section{padding:38px 0;border-bottom:1px solid var(--line)}
  .sec-tint{position:relative}
  .sec-tint-inner{display:contents}
  .sec-label{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:20px}
  .sec-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:23px;line-height:1.15}
  .sec-title-sub{font-size:12.5px;color:var(--ink-faint);margin-top:5px}
  .sec-head{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:24px}

  /* ---------- KPI ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:26px}
  .kpi{border-top:2px solid var(--accent);padding-top:15px}
  .kpi-v{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:30px;line-height:1.05;color:var(--accent);letter-spacing:-.02em;overflow-wrap:break-word}
  .kpi-u{font-weight:600;font-size:13px;line-height:1.3;margin-top:10px}
  .kpi-note{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint);margin-top:7px;line-height:1.5}

  /* ---------- THESIS / ABOUT ---------- */
  .thesis-body{max-width:760px}
  .thesis-p{font-size:15px;line-height:1.65;color:var(--ink);margin-bottom:14px}
  .thesis-p:last-of-type{margin-bottom:0}
  .thesis-src{display:inline-block;margin-top:14px}
  .focus-head{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:30px;margin-bottom:16px}
  .focus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .focus-item{border-top:2px solid var(--accent);padding-top:13px}
  .focus-t{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:var(--ink)}
  .focus-d{font-size:12.5px;line-height:1.55;color:var(--ink-soft);margin-top:7px}

  /* ---------- BOLAGET & TEAMET ---------- */
  .co-top{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;align-items:start;margin-bottom:34px}
  .co-growth{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
  .co-growth-label{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:16px}
  .co-bars{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
  .co-bar-row{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center}
  .co-bar-yr{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft)}
  .co-bar-track{background:var(--bg);border-radius:6px;height:30px;overflow:hidden}
  .co-bar-fill{height:100%;background:#B9C4D4;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:11px;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;min-width:34px;transition:width .6s ease}
  .co-bar-fill.now{background:var(--accent)}
  .co-growth-note{font-size:12px;line-height:1.6;color:var(--ink-soft)}
  .co-facts{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
  .co-facts-head{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:14px}
  .co-facts-list{margin:0}
  .co-fact{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
  .co-fact:first-child{border-top:none}
  .co-fact dt{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);padding-top:2px}
  .co-fact dd{margin:0;font-size:13px;line-height:1.5;color:var(--ink)}
  .co-mgmt-head{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:16px}
  .co-mgmt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:34px}
  .co-person{border-left:3px solid var(--accent);padding:2px 0 2px 15px}
  .co-person-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:var(--ink)}
  .co-person-role{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:3px 0 7px}
  .co-person-bio{font-size:12px;line-height:1.55;color:var(--ink-soft)}
  .co-bv{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:20px}
  .co-bv-text{font-size:13.5px;line-height:1.65;color:var(--ink-soft);margin:0}
  .co-src{font-size:11px;color:var(--ink-faint);line-height:1.55;border-top:1px solid var(--line);padding-top:14px}

  /* ---------- DEAL ECONOMICS ---------- */
  .deal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .deal-card{border:1px solid var(--line);border-left:5px solid var(--dot,var(--accent));border-radius:10px;background:var(--card);padding:20px 22px;box-shadow:0 1px 2px rgba(30,40,60,.04)}
  .deal-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .deal-partner{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px}
  .deal-prog{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.03em;color:var(--ink-faint);margin-top:3px}
  .deal-nums{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
  .deal-num{flex:0 1 auto;min-width:0}
  .deal-num-k{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .deal-num-up{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:21px;line-height:1.1;margin-top:5px;color:var(--ink);word-break:break-word}
  .deal-num-tot{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:21px;line-height:1.1;margin-top:5px;color:var(--dot,var(--accent));word-break:break-word}
  /* Textbaserade värden (t.ex. "Royaltybaserat") får mindre grad så de inte spiller */
  .deal-num-up.txt,.deal-num-tot.txt{font-size:14px;line-height:1.35}
  .deal-arrow{font-size:15px;color:var(--ink-faint);padding-bottom:3px;flex:0 0 auto}
  .deal-bar-wrap{margin-top:16px}
  .deal-bar-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .deal-bar-lbl{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
  .deal-bar-pct{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;color:var(--dot,var(--accent))}
  .deal-bar{position:relative;height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden}
  .deal-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:4px;background:var(--dot,var(--accent));min-width:3px}
  .deal-note{font-size:11.5px;line-height:1.55;color:var(--ink-soft);margin-top:14px}
  .deal-foot{font-size:11px;color:var(--ink-faint);line-height:1.55;margin-top:18px;max-width:820px}
  .deal-compact-head{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:30px;margin-bottom:14px}
  .deal-compact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .deal-compact{border:1px solid var(--line);border-left:4px solid var(--dot,var(--accent));border-radius:9px;background:var(--card);padding:15px 18px;box-shadow:0 1px 2px rgba(30,40,60,.04)}
  .dc-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .dc-partner{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px}
  .dc-tag{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
  .dc-value{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:var(--dot,var(--accent));margin-bottom:6px}
  .dc-desc{font-size:11.5px;line-height:1.5;color:var(--ink-soft);margin-bottom:10px}

  .pl-legend{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px}
  .pl-leg-item{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-soft)}
  .pl-leg-fill{width:22px;height:9px;border-radius:3px;background:var(--ink-faint);opacity:.85}
  .pl-leg-arrow{position:relative;width:22px;height:2px;background:var(--ink-faint);opacity:.55}
  .pl-leg-arrow::after{content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid var(--ink-faint);opacity:.9}
  .pl-phasehdr{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:center;margin-bottom:10px}
  .pl-phasecols{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .pl-phasecol{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);text-align:center;padding:4px 2px;border-bottom:1px solid var(--line-soft)}
  .pl-row{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:center;padding:7px 0}
  .pl-name{display:flex;align-items:center;gap:9px;min-width:0}
  .pl-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .pl-code{font-weight:600;font-size:13.5px;white-space:nowrap}
  .pl-ind{font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-track{position:relative;height:24px;border-radius:6px;background:var(--line-soft);overflow:hidden}
  .pl-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr)}
  .pl-grid span{border-right:1px solid var(--bg)}
  .pl-grid span:last-child{border-right:none}
  .pl-fill{position:absolute;top:0;left:0;height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
  .pl-fill-label{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:.04em;color:#fff;text-transform:uppercase;white-space:nowrap}
  .pl-fill-label-m{display:none;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
  .pl-target{position:absolute;top:0;height:100%;display:flex;align-items:center}
  .pl-target-line{position:absolute;left:0;right:6px;top:50%;height:2px;transform:translateY(-50%);opacity:.5;background-image:none}
  .pl-target-arrow{position:absolute;right:0;top:50%;transform:translateY(-50%);width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid;opacity:.7}
  .pl-caption{font-size:11px;color:var(--ink-faint);margin-top:14px;line-height:1.55}
  .pl-phasescale-m{display:none}

  /* ---------- (2026-tvåkolumn borttagen — ersatt av sammanslagen katalysatorsektion) ---------- */

  /* ---------- TRACKS / PROGRAM CARDS ---------- */
  /* Full-bleed tonad bakgrund: bandet går kant-till-kant, innehållet håller sidbredden */
  .track{position:relative;width:100vw;left:50%;transform:translateX(-50%);padding:32px 0;margin-top:0}
  .track:first-of-type{margin-top:8px}
  .track-inner{max-width:1180px;margin:0 auto;padding:0 48px}
  .track-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .track-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px}
  .track-sub{font-size:12px;color:var(--ink-faint)}
  .cards{display:flex;flex-direction:column;gap:12px}
  .card{border:1px solid var(--line);border-left:5px solid var(--dot,var(--accent));border-radius:10px;background:var(--card);overflow:hidden;box-shadow:0 1px 2px rgba(30,40,60,.04)}
  .card-top{display:flex;align-items:flex-start;gap:18px;padding:17px 22px}
  .card-main{flex:1;min-width:0}
  .card-titlerow{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .card-code{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
  .badge span{width:5px;height:5px;border-radius:50%}
  .card-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);margin-top:6px;letter-spacing:.01em}
  .card-summary{font-size:13px;line-height:1.55;color:var(--ink-soft);margin-top:10px;max-width:660px}
  .card-metric{text-align:right;flex:0 0 auto}
  .card-metric-v{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:23px;line-height:1;color:var(--dot,var(--accent))}
  .card-metric-l{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-faint);max-width:150px;margin-top:5px;line-height:1.4}
  .card-detail{padding:0 22px 18px;border-top:1px solid var(--line-soft)}
  .fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;margin-top:15px}
  .field-k{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
  .field-v{font-size:12.5px;line-height:1.5;color:var(--ink);margin-top:4px}
  .field-v.next{color:var(--accent);font-weight:500}
  .src{display:inline-block;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);text-decoration:none}
  .src:hover{color:var(--accent)}

  /* ---------- TIMELINE + WATCH ---------- */
  .tl-item{display:flex;gap:16px}
  .tl-date{flex:0 0 82px;text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px;line-height:1.5;color:var(--ink-faint);padding-top:1px}
  .tl-mid{flex:0 0 14px;display:flex;flex-direction:column;align-items:center}
  .tl-dot{width:11px;height:11px;border-radius:50%;margin-top:4px;box-shadow:0 0 0 3px var(--bg)}
  .tl-dot.now{width:13px;height:13px;margin-top:3px;background:var(--accent);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(62,92,140,.4)}50%{box-shadow:0 0 0 6px rgba(62,92,140,0)}}
  .tl-line{width:1.5px;flex:1;background:var(--line);margin:4px 0}
  .tl-body{flex:1;padding-bottom:22px}
  .tl-titlerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .nowtag{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:3px;padding:2px 7px}
  .tl-title{font-weight:500;font-size:14.5px;line-height:1.45}
  .tl-react{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;padding:1px 7px;border-radius:4px}
  .tl-react.pos{color:var(--pos);background:rgba(30,158,90,.1)}

function setupNav(){
  const links = Array.from(document.querySelectorAll('.navlink'));
  if(!links.length) return;
  const inner = document.querySelector('.navbar-inner');
  const navbar = document.getElementById('navbar');
  // Sektioner med en menyflik (exkl. Översikt)
  const sectionIds = links.map(l=>l.dataset.target).filter(t=>t && t!=='__all');
  const sections = sectionIds.map(id=>document.getElementById(id)).filter(Boolean);

  // Se till att inget är dolt (scroll-spy-läge: allt synligt)
  document.querySelectorAll('.sec-hidden').forEach(s=>s.classList.remove('sec-hidden'));

  // Höjd på sticky-menyn (för offset vid ankarhopp)
  const navH = ()=> (navbar ? navbar.offsetHeight : 0);

  // Centrera den aktiva pillen horisontellt i menyraden
  const centerPill = (link)=>{
    if(!link || !inner) return;
    const target = link.offsetLeft - (inner.clientWidth/2) + (link.offsetWidth/2);
    const max = inner.scrollWidth - inner.clientWidth;
    inner.scrollTo({left: Math.max(0, Math.min(max, target)), behavior:'smooth'});
  };

  let activeTarget = null;
  const setActive = (target, doCenter)=>{
    if(target===activeTarget && !doCenter) return;
    activeTarget = target;
    let activeLink = null;
    links.forEach(l=>{
      const on = l.dataset.target===target;
      l.classList.toggle('active', on);
      if(on) activeLink = l;
    });
    if(doCenter) centerPill(activeLink);
  };

  // Klick → mjukt hopp till sektionens topp (strax under sticky-menyn)
  links.forEach(link=>{
    link.addEventListener('click', e=>{
      e.preventDefault();
      const t = link.dataset.target;
      if(t==='__all'){
        window.scrollTo({top:0, behavior:'smooth'});
      } else {
        const sec = document.getElementById(t);
        if(sec){
          const y = sec.getBoundingClientRect().top + window.pageYOffset - navH() + 2;
          window.scrollTo({top:Math.max(0,y), behavior:'smooth'});
        }
      }
      setActive(t, true);
    });
  });

  // Scroll-spy: markera sektionen man är i, och centrera dess pill i menyraden
  const spy = ()=>{
    const probe = window.pageYOffset + navH() + 12; // punkten strax under menyn
    let current = '__all';
    for(const s of sections){ if(s.offsetTop <= probe) current = s.id; }
    // nära toppen → Översikt
    const firstTop = sections[0] ? sections[0].offsetTop - navH() - 40 : Infinity;
    if(window.pageYOffset < firstTop) current = '__all';
    // nära botten → sista sektionen (så sista pillen alltid kan bli aktiv)
    if((window.innerHeight + window.pageYOffset) >= (document.body.scrollHeight - 4) && sections.length){
      current = sections[sections.length-1].id;
    }
    if(current !== activeTarget){
      setActive(current, true); // true = auto-centrera pillen när sektionen byts
    }
  };

  window.removeEventListener('scroll', window.__navSpy || (()=>{}));
  window.__navSpy = spy;
  window.addEventListener('scroll', spy, {passive:true});
  window.addEventListener('resize', spy, {passive:true});
  spy();
}

function hexa(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}

/* ============================================================
   MESH-EFFEKT för varumärkestexten i headern.
   WebGL2: texten ritas till en textur som läggs på ett rutnät
   vars punkter dras med muspekaren (drag + fjäder + dämpning).
   Ingen färgsplittring — bara deformationen.
   Faller tillbaka till vanlig text om WebGL2 saknas.
   ============================================================ */
const MESH = {
  GRID_W:80, GRID_H:24,
  DRAG:1.5,        // dragstyrka (lägre = subtilare)
  SPRING_K:0.08,   // fjäder tillbaka till vila
  DAMPING:0.9,
  DT:0.1,
  raf:0, cleanup:null
};

function setupBrandMesh(){
  // Städa upp ev. tidigare instans (sker vid språkbyte → render())
  if(MESH.cleanup){ try{ MESH.cleanup(); }catch(e){} MESH.cleanup=null; }

  const wrap = document.getElementById('brandMesh');
  const canvas = document.getElementById('brandCanvas');
  if(!wrap || !canvas) return;

  const gl = canvas.getContext('webgl2', {alpha:true, premultipliedAlpha:true, antialias:true});
  if(!gl) return; // fallback-texten syns kvar

  const VERT = `#version 300 es
  in vec2 aPos; in vec2 aUv; in vec2 aDisp;
  out vec2 vUv;
  void main(){ gl_Position = vec4(aPos + aDisp, 0.0, 1.0); vUv = aUv; }`;
  const FRAG = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 outColor;
  uniform sampler2D uTex;
  void main(){ outColor = texture(uTex, vUv); }`;

  const compile=(type,src)=>{
    const sh=gl.createShader(type); gl.shaderSource(sh,src); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){ gl.deleteShader(sh); return null; }
    return sh;
  };
  const vs=compile(gl.VERTEX_SHADER,VERT), fs=compile(gl.FRAGMENT_SHADER,FRAG);
  if(!vs||!fs) return;
  const prog=gl.createProgram();
  gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) return;

  const GW=MESH.GRID_W, GH=MESH.GRID_H;
  const vertCount=(GW+1)*(GH+1);
  const positions=new Float32Array(vertCount*2), uvs=new Float32Array(vertCount*2);
  for(let y=0;y<=GH;y++) for(let x=0;x<=GW;x++){
    const i=y*(GW+1)+x, u=x/GW, v=y/GH;
    positions[i*2]=u*2-1; positions[i*2+1]=1-v*2;
    uvs[i*2]=u; uvs[i*2+1]=v;
  }
  const indices=new Uint32Array(GW*GH*6);
  let k=0;
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    const a=y*(GW+1)+x, b=a+1, c=a+(GW+1), d=c+1;
    indices[k++]=a; indices[k++]=c; indices[k++]=b;
    indices[k++]=b; indices[k++]=c; indices[k++]=d;
  }
  const disp=new Float32Array(vertCount*2), vel=new Float32Array(vertCount*2);

  const aPos=gl.getAttribLocation(prog,'aPos'), aUv=gl.getAttribLocation(prog,'aUv'), aDisp=gl.getAttribLocation(prog,'aDisp');
  const uTex=gl.getUniformLocation(prog,'uTex');
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const pb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,pb); gl.bufferData(gl.ARRAY_BUFFER,positions,gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
  const ub=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,ub); gl.bufferData(gl.ARRAY_BUFFER,uvs,gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aUv); gl.vertexAttribPointer(aUv,2,gl.FLOAT,false,0,0);
  const db=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,db); gl.bufferData(gl.ARRAY_BUFFER,disp,gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(aDisp); gl.vertexAttribPointer(aDisp,2,gl.FLOAT,false,0,0);
  const ib=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,indices,gl.STATIC_DRAW);

  const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

  const label = (DATA.ui.brandName && DATA.ui.brandName[LANG]) || 'Saniona Investor';
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#3E5C8C';

  const buildTex = async ()=>{
    const w=Math.max(2,canvas.width), h=Math.max(2,canvas.height);
    const dpr=window.devicePixelRatio||1;
    const cssH = h/dpr;
    // Utgå från boxens höjd, men krymp tills texten säkert ryms i bredd.
    let size=Math.round((cssH*0.68)*dpr);
    try{ if(document.fonts){ await document.fonts.load(`700 ${size}px 'Space Grotesk'`); await document.fonts.ready; } }catch(e){}
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const ctx=c.getContext('2d');
    const padX = 14*dpr;
    const maxW = w - padX*2;
    // Mät och skala ner om texten är bredare än canvasen
    ctx.font=`700 ${size}px 'Space Grotesk', sans-serif`;
    let tw = ctx.measureText(label).width;
    if(tw > maxW && tw > 0){
      size = Math.max(8, Math.floor(size * (maxW / tw)));
      ctx.font=`700 ${size}px 'Space Grotesk', sans-serif`;
      tw = ctx.measureText(label).width;
    }
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle=accent;
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font=`700 ${size}px 'Space Grotesk', sans-serif`;
    ctx.fillText(label, padX, h/2);
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
    wrap.classList.add('gl-on');
  };

  const resize=()=>{
    const dpr=window.devicePixelRatio||1;
    const r=wrap.getBoundingClientRect();
    const w=Math.max(2,Math.round(r.width*dpr)), h=Math.max(2,Math.round(r.height*dpr));
    if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; gl.viewport(0,0,w,h); buildTex(); }
  };
  const ro=new ResizeObserver(resize); ro.observe(wrap);
  resize(); buildTex();

  const cur={x:99,y:99,px:99,py:99,vx:0,vy:0,inside:false};
  const onMove=e=>{
    const r=canvas.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width)*2-1, y=1-((e.clientY-r.top)/r.height)*2;
    if(!cur.inside){ cur.px=x; cur.py=y; cur.inside=true; }
    cur.x=x; cur.y=y;
  };
  const onLeave=()=>{ cur.inside=false; cur.x=99; cur.y=99; cur.vx=0; cur.vy=0; };
  wrap.addEventListener('pointermove',onMove);
  wrap.addEventListener('pointerleave',onLeave);

  const tick=()=>{
    cur.vx=cur.x-cur.px; cur.vy=cur.y-cur.py;
    if(Math.hypot(cur.vx,cur.vy)>0.3){ cur.vx=0; cur.vy=0; }
    cur.px=cur.x; cur.py=cur.y;
    for(let i=0;i<vertCount;i++){
      const i2=i*2, px=positions[i2], py=positions[i2+1], dx=disp[i2], dy=disp[i2+1];
      const cd=Math.hypot(cur.x-(px+dx), cur.y-(py+dy));
      const prox=Math.max(0, 1/(1+cd/0.05)-0.1);
      let vx=vel[i2], vy=vel[i2+1];
      vx+=cur.vx*MESH.DRAG*prox; vy+=cur.vy*MESH.DRAG*prox;
      vx-=dx*MESH.SPRING_K; vy-=dy*MESH.SPRING_K;
      vx*=MESH.DAMPING; vy*=MESH.DAMPING;
      vel[i2]=vx; vel[i2+1]=vy;
      disp[i2]=Math.max(-1,Math.min(1, dx+vx*MESH.DT));
      disp[i2+1]=Math.max(-1,Math.min(1, dy+vy*MESH.DT));
    }
    gl.bindBuffer(gl.ARRAY_BUFFER,db); gl.bufferSubData(gl.ARRAY_BUFFER,0,disp);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex); gl.uniform1i(uTex,0);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(vao);
    gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_INT, 0);
    MESH.raf=requestAnimationFrame(tick);
  };
  MESH.raf=requestAnimationFrame(tick);

  MESH.cleanup=()=>{
    cancelAnimationFrame(MESH.raf); ro.disconnect();
    wrap.removeEventListener('pointermove',onMove);
    wrap.removeEventListener('pointerleave',onLeave);
    gl.deleteBuffer(pb); gl.deleteBuffer(ub); gl.deleteBuffer(db); gl.deleteBuffer(ib);
    gl.deleteTexture(tex); gl.deleteVertexArray(vao); gl.deleteProgram(prog);
    gl.deleteShader(vs); gl.deleteShader(fs);
  };
}
function setLang(l){LANG=l;render();}
render();
</script>
